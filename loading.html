<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek Harness</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #0f1115; color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    .box { text-align: center; max-width: 520px; padding: 24px; }
    .spinner {
      width: 40px; height: 40px; margin: 0 auto 22px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #5b8cff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
    p.status { font-size: 13px; color: #94a3b8; }
    p.error {
      font-size: 13px; color: #f87171; line-height: 1.7;
      margin-top: 10px; text-align: left;
      background: rgba(248, 113, 113, 0.08); border: 1px solid rgba(248, 113, 113, 0.25);
      border-radius: 8px; padding: 12px 14px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">正在启动 DeepSeek Harness…</h1>
    <p class="status" id="status">已等待 <span id="elapsed">0</span> 秒，首次启动可能稍慢</p>
    <p class="error hidden" id="error"></p>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const err = params.get('error');
    if (err) {
      document.getElementById('spinner').classList.add('hidden');
      document.getElementById('title').textContent = '后端启动失败';
      document.getElementById('status').classList.add('hidden');
      const e = document.getElementById('error');
      e.textContent = decodeURIComponent(err) +
        '\n\n可尝试：手动在终端运行 dsh（或 npm exec @deepseek-ai/dsh web）后再启动客户端；' +
        '或在启动客户端前用 DEEPSEEK_BACKEND_CMD 指定后端启动命令。';
      e.classList.remove('hidden');
    } else {
      const start = Date.now();
      setInterval(() => {
        document.getElementById('elapsed').textContent = Math.round((Date.now() - start) / 1000);
      }, 1000);
    }
  </script>
</body>
</html>
